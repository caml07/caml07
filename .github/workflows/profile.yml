name: refresh profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "README.template.md"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test profile generator
        run: python -m unittest discover -s tests -v

      - name: Refresh living profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py

      - name: Validate generated SVG widgets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path("widgets").glob("*.svg"):
              ET.parse(path)
              print(f"valid: {path}")
          PY

      - name: Commit changed profile
        run: |
          if git diff --quiet -- README.md data/profile-data.json widgets/; then
            echo "profile already current"
            exit 0
          fi
          git config user.name "cam-07-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/profile-data.json widgets/
          git commit -m "chore: refresh CAM 07 [skip ci]"
          git push
